name: Publish

# Pushes publish only when package.json's version changed; manual runs always publish.
# Nothing is published until the ZAPIER_DEPLOY_KEY secret and the ZAPIER_APP_ID variable are set.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote:
        description: Promote this version to the default for new users after pushing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: zapier-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
      ZAPIER_APP_ID: ${{ vars.ZAPIER_APP_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit so we can tell whether the version changed.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required configuration
        id: config
        run: |
          if [ -n "${ZAPIER_DEPLOY_KEY}" ] && [ -n "${ZAPIER_APP_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Set the ZAPIER_DEPLOY_KEY secret and the ZAPIER_APP_ID variable under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          else
            echo "::notice::Publishing from this repository is not set up yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Run tests
        if: steps.config.outputs.ready == 'true'
        run: npm test

      - name: Validate integration
        if: steps.config.outputs.ready == 'true'
        run: npx zapier-platform validate

      - name: Decide whether to publish
        id: gate
        if: steps.config.outputs.ready == 'true'
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV=""
          if git show HEAD~1:package.json > /tmp/prev-package.json 2>/dev/null; then
            PREV="$(node -p "require('/tmp/prev-package.json').version")"
          fi
          if [ "$CURRENT" != "$PREV" ]; then
            echo "Version changed: ${PREV:-<none>} -> $CURRENT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($CURRENT); nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Link app
        if: steps.gate.outputs.publish == 'true'
        run: echo "{\"id\":${ZAPIER_APP_ID},\"key\":\"App${ZAPIER_APP_ID}\"}" > .zapierapprc

      - name: Push version
        if: steps.gate.outputs.publish == 'true'
        run: npx zapier-platform push

      # promote asks to confirm the changelog; without --yes it reads EOF and exits 0 without promoting.
      - name: Promote version
        if: steps.gate.outputs.publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.promote
        run: npx zapier-platform promote "${{ steps.gate.outputs.version }}" --yes
